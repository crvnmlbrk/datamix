<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Data Mix</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font:15px -apple-system,system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#stage{flex:1;position:relative;min-height:0}
video,#out{position:absolute;inset:0;width:100%;height:100%}
video{object-fit:cover}
#out{display:none;object-fit:contain;image-rendering:pixelated}
#thumb{position:absolute;left:12px;bottom:12px;width:64px;height:86px;border:2px solid #fff;border-radius:8px;object-fit:cover;display:none}
#hud{position:absolute;top:12px;left:0;right:0;text-align:center;font-weight:600;letter-spacing:.08em;text-shadow:0 1px 6px #000}
#bar{display:flex;gap:14px;align-items:center;justify-content:center;padding:16px;min-height:110px}
#panel{display:none;max-height:44vh;overflow:auto;background:#111;padding:0 14px 14px;-webkit-overflow-scrolling:touch}
#acts{position:sticky;top:0;background:#111;display:flex;gap:8px;padding:10px 0;flex-wrap:wrap;z-index:2}
button{border:0;border-radius:999px;padding:11px 16px;font-size:15px;font-weight:600;background:#2a2a2a;color:#fff}
button.p{background:#fff;color:#000}
#shut{width:76px;height:76px;padding:0;border:5px solid #888}
label{display:block;margin-top:12px;font-size:13px;color:#bbb}
label b{float:right;color:#fff;font-weight:500}
input[type=range]{width:100%}
select{background:#2a2a2a;color:#fff;border:0;border-radius:8px;padding:8px;font-size:14px;width:100%}
.row{display:flex;gap:6px}
h4{margin-top:18px;font-size:12px;letter-spacing:.1em;color:#777}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="out"></canvas>
  <img id="thumb" alt="">
  <div id="hud">FOTKA 1 / 2</div>
 </div>
 <div id="bar">
  <button id="flip">⟲</button>
  <button id="shut" class="p"></button>
  <input id="file" type="file" accept="image/*" capture="environment" style="display:none">
 </div>
 <div id="panel">
  <div id="acts">
   <button id="seedb">🎲 Seed</button>
   <button id="rnd">⚡ Náhodne všetko</button>
   <button id="rst">Reset</button>
   <button id="save" class="p">Uložiť</button>
   <button id="new">Nové fotky</button>
  </div>
  <h4>KANÁLY: ODKIAĽ SA BERÚ DÁTA</h4>
  <div class="row">
   <select id="cr"></select><select id="cg"></select><select id="cb"></select>
  </div>
  <div id="sl"></div>
  <label>Bitová operácia A ∘ B</label>
  <select id="op"><option value="0">žiadna</option><option value="1">XOR</option><option value="2">AND</option><option value="3">OR</option><option value="4">ADD (súčet)</option><option value="5">SUB (rozdiel)</option><option value="6">MUL (súčin)</option><option value="7">ABS rozdiel</option></select>
 </div>
</div>
<script>
const W=720,H=960,N=W*H,$=id=>document.getElementById(id);
const v=$('v'),out=$('out'),hud=$('hud'),thumb=$('thumb');
let stream,facing='environment',shots=[],seed=1,A8,B8,A32,B32;

/* ---- kamera ---- */
async function cam(){
 try{stream&&stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:1280}},audio:false});
  v.srcObject=stream}catch(e){stream=null;hud.textContent='KLIKNI NA SPÚŠŤ'}}
function fit(src,w,h){const c=document.createElement('canvas');c.width=W;c.height=H;
 const s=Math.max(W/w,H/h);c.getContext('2d').drawImage(src,(W-w*s)/2,(H-h*s)/2,w*s,h*s);return c}
$('shut').onclick=()=>stream?add(fit(v,v.videoWidth,v.videoHeight)):$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{add(fit(im,im.width,im.height));e.target.value=''};im.src=URL.createObjectURL(f)};
$('flip').onclick=()=>{facing=facing=='environment'?'user':'environment';cam()};
function add(c){shots.push(c);
 if(shots.length==1){thumb.src=c.toDataURL('image/jpeg',.6);thumb.style.display='block';hud.textContent='FOTKA 2 / 2'}
 else{
  const a=shots[0].getContext('2d').getImageData(0,0,W,H),b=shots[1].getContext('2d').getImageData(0,0,W,H);
  A8=a.data;B8=b.data;A32=new Uint32Array(A8.buffer);B32=new Uint32Array(B8.buffer);
  stream&&stream.getTracks().forEach(t=>t.stop());
  v.style.display=thumb.style.display='none';out.style.display='block';$('bar').style.display='none';
  $('panel').style.display='block';hud.textContent='';out.width=W;out.height=H;sched()}}
$('new').onclick=()=>{shots=[];out.style.display='none';v.style.display='block';$('bar').style.display='flex';
 $('panel').style.display='none';hud.textContent='FOTKA 1 / 2';cam()};

/* ---- ovládanie ---- */
// id, popis, min, max, štart, hodnota "vypnuté"
const S=[
['cell','Veľkosť buniek (px)',1,120,14,null],
['rep','Nahradiť bunky dátami z B (%)',0,100,30,0],
['runp','Prúd bajtov: podiel z B (%)',0,100,0,0],
['run','Prúd bajtov: dĺžka behu (px)',1,800,60,null],
['disp','Adresný posun: B ukazuje, odkiaľ čítať z A',0,100,0,0],
['bits','Bitová zmes: horné bity ostanú, spodné z B (8 = vyp)',0,8,8,8],
['opp','Pokrytie bitovej operácie (%)',0,100,0,0],
['flip','Prepísanie náhodných bitov (%)',0,100,0,0],
['str','Stride desync (posun riadkov v prúde)',0,80,0,0],
['post','Hĺbka farieb (bity na kanál)',1,8,8,8]];
const chOpts=['A červená','A zelená','A modrá','B červená','B zelená','B modrá'];
['cr','cg','cb'].forEach((id,k)=>{$(id).innerHTML=chOpts.map((t,i)=>`<option value="${i}">${t}</option>`).join('');$(id).value=k;$(id).onchange=sched});
$('sl').innerHTML=S.map(s=>`<label>${s[1]}<b id="${s[0]}v">${s[4]}</b></label><input type="range" id="${s[0]}" min="${s[2]}" max="${s[3]}" value="${s[4]}">`).join('');
S.forEach(s=>$(s[0]).oninput=()=>{$(s[0]+'v').textContent=$(s[0]).value;sched()});
$('op').onchange=sched;
$('seedb').onclick=()=>{seed=Math.random()*1e6|0;sched()};
$('rst').onclick=()=>{S.forEach(s=>setS(s[0],s[4]));['cr','cg','cb'].forEach((id,k)=>$(id).value=k);$('op').value=0;sched()};
$('rnd').onclick=()=>{S.forEach(s=>{const r=Math.random();
  setS(s[0],(s[5]!==null&&r<.5)?s[5]:Math.round(s[2]+Math.random()*(s[3]-s[2])*(s[0]=='run'?.5:1)))});
 ['cr','cg','cb'].forEach((id,k)=>$(id).value=Math.random()<.35?Math.random()*6|0:k);
 $('op').value=Math.random()<.5?0:1+Math.random()*7|0;seed=Math.random()*1e6|0;sched()};
function setS(id,x){$(id).value=x;$(id+'v').textContent=x}
$('save').onclick=()=>out.toBlob(async b=>{const f=new File([b],'datamix-'+Date.now()+'.png',{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()}});

/* ---- engine: priamo nad bajtmi ---- */
let pend=0;function sched(){if(!pend&&A32){pend=1;requestAnimationFrame(()=>{pend=0;render()})}}
function h(x,y,s){let n=(x*374761393+y*668265263+s*2246822519)|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
function render(){
 const g=id=>+$(id).value,cell=g('cell'),rep=g('rep'),runp=g('runp'),run=g('run'),disp=g('disp'),bits=g('bits'),
  opp=g('opp'),flip=g('flip'),str=g('str'),post=g('post'),op=g('op');
 // 1) kanály: každý výstupný kanál si vyberie zdroj z A/B
 let X=new Uint8ClampedArray(N*4);
 [g('cr'),g('cg'),g('cb')].forEach((m,c)=>{const s=m<3?A8:B8,o=m%3;for(let i=0;i<N;i++)X[i*4+c]=s[i*4+o]});
 for(let i=3;i<N*4;i+=4)X[i]=255;
 let X32=new Uint32Array(X.buffer);
 // 2) prúd bajtov: behy pixelov v lineárnej pamäti sa prepíšu z B
 if(runp>0)for(let i=0;i<N;i++)if(h(i/run|0,7,seed)*100<runp)X32[i]=B32[i];
 // 3) bunky: obsah bunky sa nahradí kúskom B z iného miesta
 if(rep>0)for(let y=0;y<H;y++)for(let x=0;x<W;x++){const cx=x/cell|0,cy=y/cell|0;
  if(h(cx,cy,seed+1)*100<rep){const dx=Math.floor((h(cx,cy,seed+2)-.5)*cell*10),dy=Math.floor((h(cx,cy,seed+3)-.5)*cell*10);
   X32[y*W+x]=B32[((y+dy+H*9)%H)*W+(x+dx+W*9)%W]}}
 // 4) adresný posun: hodnoty pixelov B sú súradnice, odkiaľ sa číta
 if(disp>0){const Y=new Uint32Array(N),k=disp/100*2;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,b=B32[i],
   sx=Math.min(W-1,Math.max(0,x+(((b&255)-128)*k|0))),sy=Math.min(H-1,Math.max(0,y+((((b>>8)&255)-128)*k|0)));Y[i]=X32[sy*W+sx]}
  X32=Y}
 // 5) bitová zmes
 if(bits<8){const m=(0xff<<(8-bits))&255,keep=(m*0x010101|0xff000000)>>>0,inv=((~m)&255)*0x010101;
  for(let i=0;i<N;i++)X32[i]=((X32[i]&keep)|(B32[i]&inv))>>>0}
 X=new Uint8ClampedArray(X32.buffer);
 // 6) bitová operácia nad bajtmi A a B v pokrytých bunkách
 if(op&&opp>0)for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(h(x/cell|0,y/cell|0,seed+4)*100<opp){
  const i=(y*W+x)*4;for(let c=0;c<3;c++){const a=X[i+c],b=B8[i+c];
   X[i+c]=op==1?a^b:op==2?a&b:op==3?a|b:op==4?a+b:op==5?a-b:op==6?a*b/255:Math.abs(a-b)}}
 // 7) prepis náhodných bitov
 if(flip>0)for(let i=0;i<N;i++)if(h(i,1,seed+5)*100<flip/4){const q=h(i,2,seed+6);X[i*4+(q*3|0)]^=1<<(h(i,3,seed+7)*8|0)}
 // 8) stride desync: dáta sa čítajú s iným riadkovaním
 if(str>0){const Y=new Uint32Array(N);for(let i=0;i<N;i++)Y[i]=X32[(i+(i/W|0)*str)%N];X32=Y}
 // 9) redukcia bitov
 if(post<8){const m=(0xff<<(8-post))&255,k=(m*0x010101|0xff000000)>>>0;for(let i=0;i<N;i++)X32[i]=(X32[i]&k)>>>0}
 out.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(X32.buffer),W,H),0,0)}
cam();
</script>
</body>
</html>
